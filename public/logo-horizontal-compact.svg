<svg xmlns="http://www.w3.org/2000/svg" width="185" height="44" viewBox="0 0 185 44" aria-label="Lazgar horizontal compact lockup">
  <defs>
    <mask id="lzg-cut-c">
      <rect width="200" height="200" fill="white"/>
      <rect x="66" y="56" width="22" height="74" fill="black"/>
      <rect x="66" y="118" width="76" height="22" fill="black"/>
    </mask>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&amp;display=swap');
    </style>
  </defs>

  <!-- white background -->
  <rect width="185" height="44" fill="white"/>

  <!-- mark scaled to 44x44 (200 → 44, scale = 0.22) -->
  <g transform="scale(0.22)">
    <rect width="200" height="200" fill="white"/>
    <rect x="28" y="28" width="144" height="144" rx="16" fill="oklch(0.22 0.04 252)" mask="url(#lzg-cut-c)"/>
    <path d="M 172 28 L 172 60 L 140 28 Z" fill="oklch(0.72 0.16 55)"/>
  </g>

  <!-- wordmark, gap 12px after 44px mark -->
  <text x="56" y="32"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-weight="600"
    font-size="28"
    letter-spacing="-0.7"
    fill="oklch(0.22 0.04 252)">LAZGAR</text>
</svg>
