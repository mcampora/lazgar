<svg xmlns="http://www.w3.org/2000/svg" width="345" height="96" viewBox="0 0 345 96" aria-label="Lazgar horizontal full lockup">
  <defs>
    <mask id="lzg-cut-h">
      <rect width="200" height="200" fill="white"/>
      <rect x="66" y="56" width="22" height="74" fill="black"/>
      <rect x="66" y="118" width="76" height="22" fill="black"/>
    </mask>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- white background -->
  <rect width="345" height="96" fill="white"/>

  <!-- mark scaled to 96x96 (200 → 96, scale = 0.48) -->
  <g transform="scale(0.48)">
    <rect width="200" height="200" fill="white"/>
    <rect x="28" y="28" width="144" height="144" rx="16" fill="oklch(0.22 0.04 252)" mask="url(#lzg-cut-h)"/>
    <path d="M 172 28 L 172 60 L 140 28 Z" fill="oklch(0.72 0.16 55)"/>
  </g>

  <!-- divider -->
  <rect x="112" y="8" width="1" height="80" fill="oklch(0.88 0.008 250)"/>

  <!-- wordmark + tagline -->
  <text x="128" y="58"
    font-family="'Inter Tight', system-ui, sans-serif"
    font-weight="600"
    font-size="44"
    letter-spacing="-1.1"
    fill="oklch(0.22 0.04 252)">LAZGAR</text>
  <text x="129" y="76"
    font-family="'JetBrains Mono', monospace"
    font-size="11"
    letter-spacing="1.76"
    fill="oklch(0.52 0.01 250)">IT STRATEGY &amp; SOLUTIONS</text>
</svg>
